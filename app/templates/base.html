<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== SEO & META ==================== -->
    <meta
      name="description"
      content="{% block description %}Hệ thống Tư vấn Tuyển Sinh AI 2026 - Phân tích điểm thi và gợi ý ngành trường phù hợp nhất{% endblock %}"
    />

    <meta
      name="keywords"
      content="tư vấn tuyển sinh, AI chọn ngành, điểm chuẩn 2026, dự đoán đậu đại học, tra cứu ngành học, xét học bạ, đánh giá năng lực"
    />

    <meta name="author" content="Bùi Thị Thanh Huyền" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="{% block og_title %}{{ self.title() }}{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}{{ self.description() }}{% endblock %}"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ request.url }}" />
    <meta property="og:image" content="/static/images/og-image.jpg" />
    <meta property="og:locale" content="vi_VN" />

    <title>{% block title %}Tư Vấn Tuyển Sinh AI 2026{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png" />

    <!-- Tăng tốc độ load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=20260413" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    {% block head_extra %}{% endblock %}
  </head>

  <body>
    <!-- ==================== HEADER ==================== -->
    {% include "includes/header.html" %}

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main-content">{% block content %}{% endblock %}</main>

    <!-- ==================== FOOTER ==================== -->
    {% include "includes/footer.html" %}

    <!-- ==================== FLOATING CHATBOT ==================== -->
    <button
      id="chat-toggle"
      class="chat-toggle"
      aria-label="Mở chatbot tư vấn tuyển sinh AI"
    >
      <i class="fas fa-robot"></i>
    </button>

    <div id="chat-window" class="chat-window hidden">
      <div class="chat-header">
        <div class="chat-header-info">
          <strong>🤖 AI Tư Vấn Tuyển Sinh 2026</strong>
        </div>
        <button id="chat-close" class="chat-close-btn" aria-label="Đóng">
          ✕
        </button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>

      <div class="chat-input-area">
        <input
          type="text"
          id="chat-input"
          placeholder="Ví dụ: Em 24.5 điểm khối A, muốn học CNTT ở TP.HCM..."
          autocomplete="off"
        />
        <button id="chat-send" aria-label="Gửi">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/chatbot.js" defer></script>
    {% block scripts %}{% endblock %}

    <!-- Smooth scroll -->
    <script>
      document.documentElement.style.scrollBehavior = "smooth";
    </script>
  </body>
</html>
